published: 0.0.4
changes:
- version: 0.0.4
  date: '2026-05-30'
  entries:
  - bump: patch
    description: |
      Add `drover keygen` command to generate a random API key and its SHA-256 hash, printing ready-to-use server, header, and CLI forms.
- version: 0.0.3
  date: '2026-05-27'
  entries:
  - bump: patch
    description: |
      Install to `~/.local/bin` by default instead of `/usr/local/bin`, so the
      installer no longer requires root. The install directory follows this
      precedence: `$DROVER_INSTALL_DIR` > `$XDG_BIN_HOME` > `~/.local/bin`.
      A notice is printed if the install directory is not on `$PATH`.
      Download and installation steps are now logged so progress is visible.
- version: 0.0.2
  date: '2026-05-25'
  entries:
  - bump: patch
    description: |
      Validating recent CI changes.
- version: 0.0.1
  date: '2026-05-24'
  entries:
  - bump: patch
    description: |
      Initial release of the `drover` command-line client — a single
      statically-linked Go binary over the orchestrator REST API. Commands:
      `images`, `image`, `ps`, `start`, `stop`, `destroy`, and `exec` (with
      WebSocket output streaming and exit-code propagation). Configured via
      `DROVER_API_URL` / `DROVER_API_KEY`; JSON in / JSON out with documented
      exit codes. Published as cross-compiled binaries via GoReleaser.
