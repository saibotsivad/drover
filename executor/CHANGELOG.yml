published: 0.0.2
changes:
- version: 0.0.2
  date: '2026-05-30'
  entries:
  - bump: patch
    description: |
      Default to the orchestrator socket inside the per-container folder.
      The worker agent's default socket path changed from
      `/run/orchestrator.sock` to `/var/run/drover/sockets/orchestrator.sock`,
      matching the orchestrator's new per-container socket folder bind
      mount. Override with `--socket` if needed.
- version: 0.0.1
  date: '2026-05-21'
  entries:
  - bump: patch
    description: |
      Log a clear, actionable error message when the worker agent fails to connect
      to the orchestrator socket with `ConnectionRefusedError`. The message
      identifies gVisor's missing `--host-uds=all` flag as the likely cause and
      points to the Drover install docs.
