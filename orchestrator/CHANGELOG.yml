published: 0.0.14
changes:
- version: 0.0.14
  date: '2026-05-21'
  entries:
  - bump: patch
    description: |
      Fix builder (micro-container) launch failure where the executor could not
      connect to `/run/orchestrator.sock`. The socket bind-mount source was using
      the in-container path for the sockets directory, but Docker resolves bind
      sources against the host filesystem. This worked when the sockets directory
      was mounted at the same path on both sides, but broke when the
      `docker-compose.yml` default changed to `./sockets` on the host. The
      orchestrator now self-inspects its own mounts to resolve the host-side
      sockets directory path, mirroring how the host Docker socket path is
      already resolved.
- version: 0.0.13
  date: '2026-05-20'
  entries:
  - bump: patch
    description: |
      Fix startup crash on fresh deploys where the `./data` or `./logs` host
      directories don't exist yet. Docker creates missing bind-mount source
      directories as root-owned, which the orchestrator user (UID 1000) cannot
      write to. The entrypoint now chowns the data and logs directories at
      startup alongside the existing sockets-directory fix.
- version: 0.0.12
  date: '2026-05-19'
  entries:
  - bump: patch
    description: |
      Standardize the container-internal paths and host-bind contract.

      In-container paths are now fixed and not configurable:
      `/var/lib/drover/data/db.sqlite` (SQLite + future config),
      `/var/lib/drover/logs/` (captured micro-container logs when
      `DROVER_ENABLE_CONTAINER_LOGS=true`), `/var/run/docker.sock`
      (host Docker daemon), and `/var/run/drover/sockets/` (per-
      micro-container Unix sockets). Removed the path-override env
      vars `DROVER_DB_PATH`, `DROVER_SOCKET_DIR`, and
      `DROVER_DOCKER_SOCK` from the orchestrator.

      Privileged-container bind fix: previously the orchestrator used
      its in-container view of the Docker socket
      (`/var/run/docker.sock`) as the bind source when launching
      privileged micro-containers, which silently broke under rootless
      Docker (the host socket lives at `/run/user/$UID/docker.sock`,
      so Docker resolved the bind source against a non-existent host
      path and bound an empty directory at `/run/docker.sock` inside
      the privileged micro-container). The orchestrator now
      self-inspects through the Docker API at startup, reads the
      `Source` of its own `/var/run/docker.sock` mount, and uses that
      host path as the bind source. No new environment variable is
      required.

      Sample `docker-compose.yml` now uses host bind mounts under
      `./data` and `./logs` (overridable via `DROVER_DATA_DIR` and
      `DROVER_LOGS_DIR` compose-level env vars) and a host-side
      `DROVER_HOST_DOCKER_SOCK` for the Docker socket. The
      per-micro-container sockets directory is bound at
      `/var/run/drover/sockets:/var/run/drover/sockets` (the host
      path must match the container path because Docker resolves
      nested bind-mount sources against the host filesystem). The
      orchestrator entrypoint chowns that directory to UID 1000
      on startup, so no host-side pre-creation is required.
- version: 0.0.11
  date: '2026-05-18'
  entries:
  - bump: patch
    description: |
      Renamed exec route path segments from `/exec` to `/execs` for consistency
      with the plural `/containers` convention. Callers must update:
      - `POST /containers/{id}/exec` → `POST /containers/{id}/execs`
      - `GET /containers/{id}/exec/{cmd_id}` → `GET /containers/{id}/execs/{cmd_id}`
  - bump: patch
    description: |
      New `GET /containers/{id}/execs` endpoint returns a list of every command
      that has been submitted against a container (newest first), powering the
      new exec command panel in the webapp. `GET /containers/{id}/execs/{cmd_id}`
      also now includes the original `command` string in its response.
  - bump: patch
    description: |
      Detection of the orchestrator's own Docker container id is now much
      more robust. The previous regex only matched cgroupfs-driver paths
      (`/<hex>` or `/<hex>.scope`), so on every other Docker × cgroup
      combination — including the systemd driver default on modern Ubuntu
      and GitHub Actions — detection silently returned `None` and
      `GET /containers/{id}/logs/orchestrator` returned 503.

      Detection now tries three independent signals in order:
      (1) `/proc/self/cgroup` — strict `[/-]<hex>(.scope)?` match per line,
      then a loose 64-hex scan for nested kubernetes / containerd layouts;
      (2) `/proc/self/mountinfo` — every Docker container has
      `/var/lib/docker/containers/<id>/{hostname,hosts,resolv.conf}`
      bind-mounted in, leaving an unmistakable `/containers/<id>/`
      substring that is independent of cgroup driver and hostname config;
      (3) container hostname — short 12-hex id when nothing else matches,
      skipped when the operator (or Compose) has overridden hostname to a
      non-id value such as a service name.

      When detection still fails the startup warning now includes the
      actual hostname, `/proc/self/cgroup`, and `/proc/self/mountinfo`
      snapshots so the failure mode can be diagnosed from the orchestrator
      log alone.
- version: 0.0.10
  date: '2026-05-14'
  entries:
  - bump: patch
    description: |
      New `GET /containers/{id}/logs/orchestrator` endpoint returns the
      orchestrator's own structured log lines filtered to a single container,
      making it easy to see lifecycle events for one container without reading
      the full orchestrator log.
  - bump: patch
    description: |
      Captured micro-container stdout/stderr is now retained on disk
      under `DROVER_LOG_DIR` and reachable through
      `GET /containers/{id}/logs/files` (and `/logs/files/{filename}`)
      until the container is destroyed. See
      [`docs/observability.md`](../docs/observability.md) for the full
      retention model, on-disk format, and log-shipper recipes.
- version: 0.0.9
  date: '2026-05-13'
  entries:
  - bump: patch
    description: |
      Validating release and container issues.
- version: 0.0.8
  date: '2026-05-11'
  entries:
  - bump: patch
    description: |
      Switched image discovery from the `drover/` name prefix to Docker
      labels: an image is now considered Drover-managed when it carries
      `drover.managed=true` and `drover.name=<name>`. Image responses
      additionally expose a `labels` field carrying the full `drover.*`
      label set (filtered so non-Drover labels don't leak), and the
      `tags` field lists the underlying Docker tags for information only.
- version: 0.0.7
  date: '2026-05-10'
  entries:
  - bump: patch
    description: |
      Bump the Docker API version.
- version: 0.0.6
  date: '2026-05-10'
  entries:
  - bump: patch
    description: |
      Handle the rootless-Docker case where `/var/run/docker.sock` doesn't
      exist on the host. Docker silently materialises the missing source path
      as an empty directory inside the container, so the previous fix saw a
      non-socket and the call failed with EACCES.

      The entrypoint now distinguishes "missing path", "directory" and
      "non-socket" cases at startup and prints a hint pointing rootless users
      at `$XDG_RUNTIME_DIR/docker.sock`. The 503 response body from the
      Docker exception handler stats the configured socket and includes the
      same hint, so it shows up in the webapp UI. `docker-compose.yml` now
      bind-mounts `${DOCKER_SOCK:-/var/run/docker.sock}` and documents the
      rootless override inline.
- version: 0.0.5
  date: '2026-05-10'
  entries:
  - bump: patch
    description: |
      Fix `Permission denied` when the orchestrator container connects to the
      Docker socket. The entrypoint now starts as root, joins the `orchestrator`
      user to the socket's group at runtime, then drops privileges via `gosu`.
      Also adds FastAPI exception handlers for `httpx.RequestError` and
      `DockerError` so socket / Docker failures surface as 503/502 responses
      with a useful `detail` body instead of a bare 500.
