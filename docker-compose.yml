# Sample compose stack for running Drover with the optional management UI.
#
# Both services share a private user-defined network. Only the webapp's port
# is published — the orchestrator is reachable from the host only by going
# through the webapp (either its rendered pages or its /api/orchestrator/*
# proxy). Set DROVER_API_KEY (in both services) before exposing the webapp
# beyond a trusted LAN.
#
# Container paths inside the orchestrator are FIXED and not configurable:
#
#   /var/lib/drover/data       SQLite database (+ future config files)
#   /var/lib/drover/logs       captured micro-container stdout/stderr
#                              (only written when DROVER_ENABLE_CONTAINER_LOGS=true)
#   /var/run/docker.sock       host Docker daemon socket
#   /var/run/drover/sockets    per-micro-container Unix sockets
#
# The host-side bind paths below default to relative directories next to
# this compose file, and can be overridden via DROVER_DATA_DIR /
# DROVER_LOGS_DIR (e.g. in a .env file) when you want the data and logs
# on a different filesystem.
#
# The per-micro-container socket directory MUST be /var/run/drover/sockets
# on both the host and inside the orchestrator — Docker resolves nested
# bind-mount sources against the host filesystem, so the path has to
# match on both sides. The orchestrator entrypoint chowns the host
# directory at startup, so you don't need to pre-create it.
#
# Rootless Docker note: the host Docker socket lives at /run/user/$UID/docker.sock,
# not /var/run/docker.sock. Either export DROVER_HOST_DOCKER_SOCK before running compose:
#
#     export DROVER_HOST_DOCKER_SOCK=$XDG_RUNTIME_DIR/docker.sock   # or /run/user/$(id -u)/docker.sock
#     docker compose up
#
# or put it in a .env file next to this compose.yml. The orchestrator
# entrypoint detects the socket's GID at runtime, so no further setup
# is needed.

services:
  orchestrator:
    image: ghcr.io/saibotsivad/drover:latest
    # Or build from source:
    # build: ./orchestrator
    networks: [drover]
    volumes:
      - ${DROVER_DATA_DIR:-./data}:/var/lib/drover/data
      - ${DROVER_LOGS_DIR:-./logs}:/var/lib/drover/logs
      - /var/run/drover/sockets:/var/run/drover/sockets
      - ${DROVER_HOST_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      LOG_LEVEL: INFO
      # Capture each micro-container's stdout/stderr to disk so the full
      # history survives stop/restart and is reachable through
      # /containers/{id}/logs/files. This roughly doubles per-container
      # disk usage because Docker's own log driver also keeps a copy;
      # docs/observability.md walks through how to disable one or the
      # other if disk is tight. Set to the exact string "true" to enable;
      # any other value (or unset) leaves capture off.
      DROVER_ENABLE_CONTAINER_LOGS: "true"
      # DROVER_API_KEY: change-me

  webapp:
    image: ghcr.io/saibotsivad/drover-webapp:latest
    # Or build from source:
    # build: ./webapp
    networks: [drover]
    depends_on: [orchestrator]
    ports:
      - "9091:8080"
    environment:
      DROVER_ORCHESTRATOR_URL: http://orchestrator:8000
      LOG_LEVEL: info
      # DROVER_API_KEY: change-me

  # Template image — not a long-running service. The orchestrator discovers
  # it on the host Docker daemon by its drover.managed / drover.name labels
  # and launches containers from it on demand. This entry exists so
  # `docker compose pull` (and `up`) fetch the image; the container itself
  # exits immediately and is not restarted.
  builder:
    image: ghcr.io/saibotsivad/drover-builder:latest
    # Or build from source:
    # build: ./builder
    command: ["true"]
    restart: "no"

networks:
  drover:
