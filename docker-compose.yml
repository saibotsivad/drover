# Sample compose stack for running Drover with the optional management UI.
#
# Both services share a private user-defined network. Only the webapp's port
# is published — the orchestrator is reachable from the host only by going
# through the webapp (either its rendered pages or its /api/orchestrator/*
# proxy). Set DROVER_API_KEY (in both services) before exposing the webapp
# beyond a trusted LAN.
#
# The defaults below assume rootful Docker. For rootless Docker, set in your
# shell or .env file:
#
#     export DROVER_DOCKER_SOCK="$XDG_RUNTIME_DIR/docker.sock"
#     export DROVER_SOCKET_DIR="$XDG_RUNTIME_DIR/drover/sockets"
#     mkdir -p "$DROVER_SOCKET_DIR"
#     docker compose up
#
# The orchestrator entrypoint detects the Docker socket's GID at runtime,
# so no extra group setup is needed for rootless or rootful.
#
# The DROVER_SOCKET_DIR host folder must exist before `up`. /var/run is a
# tmpfs on most distros, so the rootful default needs `mkdir -p` (as root)
# on every boot — a systemd-tmpfiles.d rule is a clean way to automate it.

services:
  orchestrator:
    image: ghcr.io/saibotsivad/drover:latest
    # Or build from source:
    # build: ./orchestrator
    networks: [drover]
    volumes:
      - ${DROVER_DATA_DIR:-drover-data}:/var/lib/orchestrator
      - ${DROVER_SOCKET_DIR:-/var/run/drover/sockets}:/var/run/microcontainers
      - ${DROVER_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      # Host-side socket folder path; the orchestrator passes this to the
      # Docker daemon when it bind-mounts a per-container socket into a
      # micro-container. Must match the host side of the volume above.
      DROVER_SOCKET_DIR: ${DROVER_SOCKET_DIR:-/var/run/drover/sockets}
      DROVER_LOG_LEVEL: INFO
      # Capture each micro-container's stdout/stderr to disk so the full
      # history survives stop/restart and is reachable through
      # /containers/{id}/logs/files. This roughly doubles per-container
      # disk usage because Docker's own log driver also keeps a copy;
      # docs/observability.md walks through how to disable one or the
      # other if disk is tight. Logs live inside the existing data
      # directory — no second volume to manage.
      DROVER_LOG_DIR: /var/lib/orchestrator/logs
      # DROVER_API_KEY: change-me
      # DROVER_PRIVILEGED_IMAGE: ghcr.io/saibotsivad/drover-builder:latest

  webapp:
    image: ghcr.io/saibotsivad/drover-webapp:latest
    # Or build from source:
    # build: ./webapp
    networks: [drover]
    depends_on: [orchestrator]
    ports:
      - "9091:8080"
    environment:
      DROVER_ORCHESTRATOR_URL: http://orchestrator:8000
      DROVER_LOG_LEVEL: info
      # DROVER_API_KEY: change-me

  # Template image — not a long-running service. The orchestrator discovers
  # it on the host Docker daemon by its drover.managed / drover.name labels
  # and launches containers from it on demand. This entry exists so
  # `docker compose pull` (and `up`) fetch the image; the container itself
  # exits immediately and is not restarted.
  builder:
    image: ghcr.io/saibotsivad/drover-builder:latest
    # Or build from source:
    # build: ./builder
    command: ["true"]
    restart: "no"

networks:
  drover:

volumes:
  drover-data:
