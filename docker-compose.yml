# Sample compose stack for running Drover with the optional management UI.
#
# Both services share a private user-defined network. Only the webapp's port
# is published — the orchestrator is reachable from the host only by going
# through the webapp (either its rendered pages or its /api/orchestrator/*
# proxy). Set DROVER_API_KEY (in both services) before exposing the webapp
# beyond a trusted LAN.
#
# Rootless Docker: the host socket lives at /run/user/$UID/docker.sock, not
# /var/run/docker.sock. Either export DOCKER_SOCK before running compose:
#
#     export DOCKER_SOCK=$XDG_RUNTIME_DIR/docker.sock   # or /run/user/$(id -u)/docker.sock
#     docker compose up
#
# or put it in a .env file next to this compose.yml. The orchestrator
# entrypoint detects the socket's GID at runtime, so no further setup
# is needed.
#
# Socket directory: when the orchestrator launches a micro-container it passes
# the socket path to the Docker daemon, which resolves it against the *host*
# filesystem. A named volume won't work here because the daemon-visible host
# path differs from the in-container path. Instead a bind-mount is used and
# SOCKET_HOST_DIR tells the orchestrator which host path to use in the Docker
# API call; SOCKET_DIR is the in-container path.
#
# Create the host directory before the first `docker compose up`:
#
#     mkdir -p /tmp/drover-sockets   # or set SOCKET_HOST_DIR to your preferred path
#     docker compose up

services:
  orchestrator:
    image: ghcr.io/saibotsivad/drover:latest
    # Or build from source:
    # build: ./orchestrator
    networks: [drover]
    volumes:
      - drover-data:/var/lib/orchestrator
      - ${SOCKET_HOST_DIR:-/tmp/drover-sockets}:/var/run/microcontainers
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      DB_PATH: /var/lib/orchestrator/db.sqlite
      SOCKET_DIR: /var/run/microcontainers
      SOCKET_HOST_DIR: ${SOCKET_HOST_DIR:-/tmp/drover-sockets}
      LOG_LEVEL: INFO
      # Capture each micro-container's stdout/stderr to disk so the full
      # history survives stop/restart and is reachable through
      # /containers/{id}/logs/files. This roughly doubles per-container
      # disk usage because Docker's own log driver also keeps a copy;
      # docs/observability.md walks through how to disable one or the
      # other if disk is tight. Logs live inside the existing
      # drover-data volume — no second volume to manage.
      DROVER_LOG_DIR: /var/lib/orchestrator/logs
      # DROVER_API_KEY: change-me

  webapp:
    image: ghcr.io/saibotsivad/drover-webapp:latest
    # Or build from source:
    # build: ./webapp
    networks: [drover]
    depends_on: [orchestrator]
    ports:
      - "9091:8080"
    environment:
      DROVER_ORCHESTRATOR_URL: http://orchestrator:8000
      LOG_LEVEL: info
      # DROVER_API_KEY: change-me

  # Template image — not a long-running service. The orchestrator discovers
  # it on the host Docker daemon by its drover.managed / drover.name labels
  # and launches containers from it on demand. This entry exists so
  # `docker compose pull` (and `up`) fetch the image; the container itself
  # exits immediately and is not restarted.
  builder:
    image: ghcr.io/saibotsivad/drover-builder:latest
    # Or build from source:
    # build: ./builder
    command: ["true"]
    restart: "no"

networks:
  drover:

volumes:
  drover-data:
