- project: orchestrator
  bump: patch
  description: |
    `POST /containers/{id}/resume` now mirrors the `POST /containers` init
    flow: it returns immediately with status `resuming`, then transitions
    to `running` only after Docker starts the container AND the guest agent
    reconnects to the orchestrator socket and re-sends a `ready` message.
    Previously the row flipped to `running` as soon as `docker start`
    returned, leaving a window where the API reported the container as
    running but exec calls failed with `409 ContainerNotConnected`.

    A new resume watchdog fires `DROVER_INIT_TIMEOUT_SECONDS` (the existing
    knob is reused) after the resume request and transitions the row to
    `error` if `ready` never arrives. Two new `error_code` values are set
    by the new failure paths:

    - `resume_docker_error` — Docker start call failed during resume.
    - `resume_timeout` — guest agent did not reconnect/send `ready` in time.

    The existing `orchestrator_crash` error code now also covers rows
    interrupted while in `resuming` (previously only `initializing` was
    handled by startup reconciliation).

- project: webapp
  bump: patch
  description: |
    Add a Resume button to the container-detail view that appears when the
    container is in the `stopped` state. Clicking it calls the orchestrator's
    `POST /containers/{id}/resume` via a new
    `POST /actions/containers/{id}/resume` action route and redirects back to
    the detail page so the UI reflects the new `resuming` state (which then
    transitions to `running` once the guest agent reconnects).
