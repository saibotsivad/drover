- project: builder
  bump: patch
  description: |
    Declare the `drover.capabilities="exec"` image label so the orchestrator
    and webapp know the builder supports exec commands.
- project: orchestrator
  bump: patch
  description: |
    Enforce the `drover.capabilities` image label: exec requests are rejected
    with 422 unless the image declares the `exec` capability. An absent/empty
    label or an unresolvable image is denied rather than assumed.
- project: webapp
  bump: patch
  description: |
    Hide the exec command UI on the container detail page when the image does
    not declare the `exec` capability, with a note explaining why.
