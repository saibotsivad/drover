- project: builder
  bump: minor
  description: |
    First real cut of the builder image. Replaces the stub Dockerfile
    with one that bundles the `drover-executor` guest agent, the Docker
    CLI (plus buildx), and git, so the orchestrator can drive it as a
    privileged micro-container that builds, pulls, and pushes images on
    the host Docker daemon. Adds `builder/README.md` documenting the
    image contents, build, operator setup, and customisation hooks.
