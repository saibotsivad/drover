- project: orchestrator
  bump: patch
  description: |
    Add a per-container WebSocket endpoint at `GET /containers/{id}/ws` that
    streams both exec command output and the container's Docker logs in real
    time. Replaces polling for long-running commands. Messages are JSON
    objects tagged with `type: "output" | "status" | "log" | "error"`;
    exec messages carry the `command_id` so clients can correlate with the
    REST exec API. Multiple WebSocket clients per container are supported;
    each gets an independent 256-message queue with drop-on-full semantics
    so a slow consumer can't back-pressure the orchestrator.

    Auth uses the same Bearer token as the REST API (header during the HTTP
    upgrade) with a `?token=` query-param fallback for browser clients that
    can't set custom headers. A `?tail=<N>` parameter replays the last N
    Docker log lines before live-tailing.

    Operator note: any reverse proxy in front of the orchestrator must
    forward the `Upgrade` and `Connection` headers and speak HTTP/1.1
    upstream. Caddy and Traefik handle this automatically; nginx needs the
    standard three-line config. See the orchestrator README for the full
    message schema and a minimal Python client.
