name: E2E

# Manual-trigger only for now. Once the suite is stable and fast enough
# this can be promoted to `pull_request` against main — the job already
# tears the stack down at the end and uploads logs on failure, so there
# are no carry-over side effects to worry about.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The CLI e2e test (e2e/tests/07-cli.sh) builds the `drover` Go binary
      # from cli/ and drives the live orchestrator through it. Set up the Go
      # toolchain here; the test script owns the actual `go build` (mirroring
      # how it owns invoking the binary), so nothing else in the workflow
      # changes. Cache keyed on cli/go.sum so the module download is warm.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache-dependency-path: cli/go.sum

      - name: Install gVisor (runsc)
        run: |
          set -e
          ARCH=$(uname -m)
          URL="https://storage.googleapis.com/gvisor/releases/release/latest/${ARCH}"
          wget -q "${URL}/runsc" "${URL}/runsc.sha512"
          sha512sum -c runsc.sha512
          rm -f runsc.sha512
          chmod 755 runsc
          sudo mv runsc /usr/local/bin/
          sudo runsc install
          # Without --host-uds=all, gVisor blocks the guest agent from
          # connecting back to the per-container orchestrator socket
          # bind-mounted into the container, and every non-privileged
          # container hits init_timeout. See docs/full-e2e-suite.md.
          sudo python3 -c "import json; p='/etc/docker/daemon.json'; d=json.load(open(p)); d['runtimes']['runsc']['runtimeArgs']=['--host-uds=all']; json.dump(d,open(p,'w'),indent=2)"
          sudo systemctl reload docker

      - name: Install jq
        run: |
          # Ubuntu runners already ship with jq, but a missing jq breaks
          # the assertion helpers in a confusing way, so install
          # explicitly and let the step fail loudly if it isn't available.
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends jq
          fi
          jq --version

      - uses: docker/setup-buildx-action@v3

      - name: Run e2e suite
        run: ./e2e/run.sh ci

      # `./e2e/run.sh ci` captures every container's full logs to disk
      # before it tears the stack down (see docs/full-e2e-suite.md), and
      # `e2e/run-playwright.sh` tees the Playwright runner's stdout to
      # `e2e/playwright/results/playwright.log`. This step prints both
      # in collapsible groups so the workflow view mirrors the contents
      # of the uploaded artifacts below.
      #
      # `e2e/playwright/results/` is filtered to text outputs (`*.log`,
      # `*.txt`) — the HTML report assets and per-test trace zips live
      # there too but aren't useful to dump into the CI log; download
      # the `e2e-playwright-results` artifact for those.
      - name: Print e2e logs
        if: always()
        run: |
          found=0
          if [ -d e2e/logs ]; then
            while IFS= read -r -d '' f; do
              found=1
              echo "::group::$f"
              cat -- "$f"
              echo "::endgroup::"
            done < <(find e2e/logs -type f -print0 | sort -z)
          fi
          if [ -d e2e/playwright/results ]; then
            while IFS= read -r -d '' f; do
              found=1
              echo "::group::$f"
              cat -- "$f"
              echo "::endgroup::"
            done < <(find e2e/playwright/results -type f \( -name '*.log' -o -name '*.txt' \) -print0 | sort -z)
          fi
          if [ "$found" -eq 0 ]; then
            echo "(no e2e log files captured)"
          fi

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e/logs/
          if-no-files-found: warn

      # Playwright HTML report and traces live under a separate path
      # (e2e/playwright/results/) so the Drover service logs and the
      # test-runner artifacts stay clearly separated.
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-results
          path: e2e/playwright/results/
          if-no-files-found: warn
