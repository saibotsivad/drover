name: E2E

# Manual-trigger only for now. Once the suite is stable and fast enough
# this can be promoted to `pull_request` against main — the job already
# tears the stack down at the end and uploads logs on failure, so there
# are no carry-over side effects to worry about.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install gVisor (runsc)
        run: |
          set -e
          ARCH=$(uname -m)
          URL="https://storage.googleapis.com/gvisor/releases/release/latest/${ARCH}"
          wget -q "${URL}/runsc" "${URL}/runsc.sha512"
          sha512sum -c runsc.sha512
          rm -f runsc.sha512
          chmod 755 runsc
          sudo mv runsc /usr/local/bin/
          sudo runsc install
          # Without --host-uds=all, gVisor blocks the guest agent from
          # connecting back to the per-container orchestrator socket
          # bind-mounted into the container, and every non-privileged
          # container hits init_timeout. See docs/full-e2e-suite.md.
          sudo python3 -c "import json; p='/etc/docker/daemon.json'; d=json.load(open(p)); d['runtimes']['runsc']['runtimeArgs']=['--host-uds=all']; json.dump(d,open(p,'w'),indent=2)"
          sudo systemctl reload docker

      - name: Install jq
        run: |
          # Ubuntu runners already ship with jq, but a missing jq breaks
          # the assertion helpers in a confusing way, so install
          # explicitly and let the step fail loudly if it isn't available.
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends jq
          fi
          jq --version

      - uses: docker/setup-buildx-action@v3

      - name: Run e2e suite
        run: ./e2e/run.sh ci

      # `./e2e/run.sh ci` captures the full container logs to
      # e2e/logs/{orchestrator,webapp}.log before it tears the stack
      # down, so these steps print them from disk rather than calling
      # `docker logs` against containers that no longer exist.
      - name: Print orchestrator logs
        if: always()
        run: |
          if [ -f e2e/logs/orchestrator.log ]; then
            cat e2e/logs/orchestrator.log
          else
            echo "(no orchestrator log captured)"
          fi

      - name: Print webapp logs
        if: always()
        run: |
          if [ -f e2e/logs/webapp.log ]; then
            cat e2e/logs/webapp.log
          else
            echo "(no webapp log captured)"
          fi

      - name: Print micro-container logs
        if: always()
        run: |
          # One file per Docker container the orchestrator spawned. The
          # files are written by `./e2e/run.sh ci` before tear-down (see
          # docs/full-e2e-suite.md → "Micro-container logs"). Print each
          # in its own grouped section so the workflow log stays scannable.
          shopt -s nullglob
          files=(e2e/logs/microcontainers/*.log)
          if [ ${#files[@]} -eq 0 ]; then
            echo "(no micro-container logs captured)"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e/logs/
          if-no-files-found: warn
