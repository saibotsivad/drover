name: E2E PoC

on:
  workflow_dispatch:

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - name: Install gVisor
        run: |
          set -e
          ARCH=$(uname -m)
          URL="https://storage.googleapis.com/gvisor/releases/release/latest/${ARCH}"
          wget -q "${URL}/runsc" "${URL}/runsc.sha512"
          sha512sum -c runsc.sha512
          rm -f runsc.sha512
          chmod 755 runsc
          sudo mv runsc /usr/local/bin/
          sudo runsc install
          sudo systemctl reload docker

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./orchestrator/Dockerfile
          push: false
          load: true
          tags: drover:e2e

      - name: Build builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./builder/Dockerfile
          push: false
          load: true
          tags: drover-builder:e2e

      - name: Start orchestrator
        run: |
          # SOCKET_DIR must be a bind-mount at the same path inside and outside
          # the orchestrator container. When the orchestrator tells Docker to
          # mount a socket into the builder container, Docker resolves that path
          # from the host — so the host path and the in-container path must match.
          mkdir -p /tmp/drover-sockets
          chmod 777 /tmp/drover-sockets
          docker run -d --name drover-e2e \
            -p 8000:8000 \
            -e DB_PATH=/tmp/db.sqlite \
            -e SOCKET_DIR=/tmp/drover-sockets \
            -e PRIVILEGED_IMAGE=drover-builder:e2e \
            -v /tmp/drover-sockets:/tmp/drover-sockets \
            -v /var/run/docker.sock:/var/run/docker.sock \
            drover:e2e

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Orchestrator is healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Orchestrator did not become healthy within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Verify health response
        run: |
          curl -sf http://localhost:8000/health \
            | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['healthy'] is True, d"
          echo "Health check passed"

      - name: Launch privileged container
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:8000/containers \
            -H 'Content-Type: application/json' \
            -d '{"image": "builder", "privileged": true, "env": {"EXAMPLE": "hello"}}')
          echo "Create response: $RESPONSE"
          CONTAINER_ID=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          echo "Container ID: $CONTAINER_ID"
          echo "DROVER_CONTAINER_ID=$CONTAINER_ID" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do
            STATUS_RESPONSE=$(curl -sf "http://localhost:8000/containers/$CONTAINER_ID")
            STATUS=$(echo "$STATUS_RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
            echo "Status (${i}s): $STATUS"
            if [ "$STATUS" = "running" ]; then
              echo "Builder container is running"
              break
            fi
            if [ "$STATUS" = "error" ]; then
              ERROR_CODE=$(echo "$STATUS_RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('error_code', 'unknown'))")
              echo "Builder container failed with error_code: $ERROR_CODE"
              exit 1
            fi
            if [ "$i" -eq 30 ]; then
              echo "Builder container did not become running within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Exec command in container
        run: |
          EXEC_RESPONSE=$(curl -sf -X POST "http://localhost:8000/containers/$DROVER_CONTAINER_ID/exec" \
            -H 'Content-Type: application/json' \
            -d '{"command": "echo $EXAMPLE"}')
          echo "Exec response: $EXEC_RESPONSE"
          COMMAND_ID=$(echo "$EXEC_RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['command_id'])")
          echo "Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            EXEC_STATUS=$(curl -sf "http://localhost:8000/containers/$DROVER_CONTAINER_ID/exec/$COMMAND_ID")
            STATUS=$(echo "$EXEC_STATUS" | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
            echo "Exec status (${i}s): $STATUS"
            if [ "$STATUS" = "complete" ]; then
              EXIT_CODE=$(echo "$EXEC_STATUS" | python3 -c "import sys, json; print(json.load(sys.stdin)['exit_code'])")
              STDOUT=$(echo "$EXEC_STATUS" | python3 -c "import sys, json; d=json.load(sys.stdin); print(''.join(m['data'] for m in d['messages'] if m['stream']=='stdout'), end='')")
              echo "Exit code: $EXIT_CODE"
              echo "Stdout: $STDOUT"
              if [ "$EXIT_CODE" != "0" ]; then
                echo "Command failed with exit code $EXIT_CODE"
                exit 1
              fi
              if echo "$STDOUT" | grep -q "hello"; then
                echo "Output check passed"
              else
                echo "Expected 'hello' in stdout, got: $STDOUT"
                exit 1
              fi
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Command did not complete within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Build image from inside builder container
        run: |
          BUILD_CMD="git clone --depth 1 https://github.com/saibotsivad/drover.git /tmp/drover && DOCKER_HOST=unix:///run/docker.sock docker build -f /tmp/drover/builder/Dockerfile --label drover.managed=true --label drover.name=test-worker -t drover-test-worker:e2e /tmp/drover"
          EXEC_RESPONSE=$(curl -sf -X POST "http://localhost:8000/containers/$DROVER_CONTAINER_ID/exec" \
            -H 'Content-Type: application/json' \
            -d "{\"command\": \"$BUILD_CMD\"}")
          echo "Exec response: $EXEC_RESPONSE"
          COMMAND_ID=$(echo "$EXEC_RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['command_id'])")
          echo "Command ID: $COMMAND_ID"

          for i in $(seq 1 120); do
            EXEC_STATUS=$(curl -sf "http://localhost:8000/containers/$DROVER_CONTAINER_ID/exec/$COMMAND_ID")
            STATUS=$(echo "$EXEC_STATUS" | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
            if [ "$STATUS" = "complete" ]; then
              echo "--- build output ---"
              echo "$EXEC_STATUS" | python3 -c "import sys, json; d=json.load(sys.stdin); print(''.join(m['data'] for m in d['messages']), end='')"
              echo "--- end build output ---"
              EXIT_CODE=$(echo "$EXEC_STATUS" | python3 -c "import sys, json; print(json.load(sys.stdin)['exit_code'])")
              echo "Exit code: $EXIT_CODE"
              if [ "$EXIT_CODE" != "0" ]; then
                echo "Build failed"
                exit 1
              fi
              echo "Build succeeded"
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "Build did not complete within 120s"
              exit 1
            fi
            sleep 1
          done

      - name: Verify built image is discoverable
        run: |
          RESPONSE=$(curl -sf "http://localhost:8000/images/test-worker")
          echo "Image response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys, json; d=json.load(sys.stdin); assert d['name']=='test-worker', d"
          echo "Image verified"

      - name: Stop privileged container
        run: |
          curl -sf -X POST "http://localhost:8000/containers/$DROVER_CONTAINER_ID/stop"

          for i in $(seq 1 30); do
            STATUS_RESPONSE=$(curl -sf "http://localhost:8000/containers/$DROVER_CONTAINER_ID")
            STATUS=$(echo "$STATUS_RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
            echo "Status (${i}s): $STATUS"
            if [ "$STATUS" = "stopped" ]; then
              echo "Privileged container stopped"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Privileged container did not stop within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Launch non-privileged container (gVisor)
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:8000/containers \
            -H 'Content-Type: application/json' \
            -d '{"image": "test-worker", "privileged": false, "env": {"EXAMPLE": "hello"}}')
          echo "Create response: $RESPONSE"
          WORKER_ID=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          echo "Worker ID: $WORKER_ID"
          echo "DROVER_WORKER_ID=$WORKER_ID" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do
            STATUS_RESPONSE=$(curl -sf "http://localhost:8000/containers/$WORKER_ID")
            STATUS=$(echo "$STATUS_RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
            echo "Status (${i}s): $STATUS"
            if [ "$STATUS" = "running" ]; then
              echo "Non-privileged container is running"
              break
            fi
            if [ "$STATUS" = "error" ]; then
              ERROR_CODE=$(echo "$STATUS_RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('error_code', 'unknown'))")
              echo "Non-privileged container failed with error_code: $ERROR_CODE"
              exit 1
            fi
            if [ "$i" -eq 30 ]; then
              echo "Non-privileged container did not become running within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Exec command in non-privileged container
        run: |
          EXEC_RESPONSE=$(curl -sf -X POST "http://localhost:8000/containers/$DROVER_WORKER_ID/exec" \
            -H 'Content-Type: application/json' \
            -d '{"command": "echo $EXAMPLE"}')
          echo "Exec response: $EXEC_RESPONSE"
          COMMAND_ID=$(echo "$EXEC_RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['command_id'])")
          echo "Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            EXEC_STATUS=$(curl -sf "http://localhost:8000/containers/$DROVER_WORKER_ID/exec/$COMMAND_ID")
            STATUS=$(echo "$EXEC_STATUS" | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
            echo "Exec status (${i}s): $STATUS"
            if [ "$STATUS" = "complete" ]; then
              EXIT_CODE=$(echo "$EXEC_STATUS" | python3 -c "import sys, json; print(json.load(sys.stdin)['exit_code'])")
              STDOUT=$(echo "$EXEC_STATUS" | python3 -c "import sys, json; d=json.load(sys.stdin); print(''.join(m['data'] for m in d['messages'] if m['stream']=='stdout'), end='')")
              echo "Exit code: $EXIT_CODE"
              echo "Stdout: $STDOUT"
              if [ "$EXIT_CODE" != "0" ]; then
                echo "Command failed with exit code $EXIT_CODE"
                exit 1
              fi
              if echo "$STDOUT" | grep -q "hello"; then
                echo "Output check passed"
              else
                echo "Expected 'hello' in stdout, got: $STDOUT"
                exit 1
              fi
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Command did not complete within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Print orchestrator logs
        if: always()
        run: docker logs drover-e2e

      - name: Print builder container logs
        if: always()
        run: |
          DOCKER_ID=$(docker ps -a --filter "ancestor=drover-builder:e2e" --format "{{.ID}}" | head -1)
          if [ -n "$DOCKER_ID" ]; then
            echo "Builder Docker container ID: $DOCKER_ID"
            docker logs "$DOCKER_ID"
          else
            echo "No builder container found"
          fi

      - name: Print worker container logs
        if: always()
        run: |
          DOCKER_ID=$(docker ps -a --filter "ancestor=drover-test-worker:e2e" --format "{{.ID}}" | head -1)
          if [ -n "$DOCKER_ID" ]; then
            echo "Worker Docker container ID: $DOCKER_ID"
            docker logs "$DOCKER_ID"
          else
            echo "No worker container found"
          fi

      - name: Stop orchestrator
        if: always()
        run: docker stop drover-e2e

