name: E2E PoC

on:
  workflow_dispatch:

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./orchestrator/Dockerfile
          push: false
          load: true
          tags: drover:e2e

      - name: Build builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./builder/Dockerfile
          push: false
          load: true
          tags: drover-builder:e2e

      - name: Start orchestrator
        run: |
          docker run -d --name drover-e2e \
            -p 8000:8000 \
            -e DB_PATH=/tmp/db.sqlite \
            -e SOCKET_DIR=/tmp/sockets \
            drover:e2e

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Orchestrator is healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Orchestrator did not become healthy within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Verify health response
        run: |
          curl -sf http://localhost:8000/health \
            | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['healthy'] is True, d"
          echo "Health check passed"

      - name: Print orchestrator logs
        if: always()
        run: docker logs drover-e2e

      - name: Stop orchestrator
        if: always()
        run: docker stop drover-e2e

  gvisor:
    runs-on: ubuntu-latest
    steps:
      - name: Install gVisor
        run: |
          set -e
          ARCH=$(uname -m)
          URL="https://storage.googleapis.com/gvisor/releases/release/latest/${ARCH}"
          wget -q "${URL}/runsc" "${URL}/runsc.sha512"
          sha512sum -c runsc.sha512
          rm -f runsc.sha512
          chmod 755 runsc
          sudo mv runsc /usr/local/bin/

      - name: Configure Docker runtime
        run: |
          sudo runsc install
          sudo systemctl reload docker

      - name: Verify gVisor runtime
        run: |
          docker run --rm --runtime=runsc hello-world
          echo "gVisor runtime verified"
