name: Publish webapp Docker image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "webapp-v*"

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}-webapp

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      webapp: ${{ steps.detect.outputs.webapp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect whether webapp/ changed on main
        id: detect
        run: |
          set -euo pipefail
          webapp=false
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            changed=$(git diff --name-only HEAD~1 HEAD || true)
            if echo "$changed" | grep -q "^webapp/"; then webapp=true; fi
          fi
          echo "webapp=$webapp" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: detect-changes
    if: |
      startsWith(github.ref, 'refs/tags/webapp-v') ||
      (github.ref == 'refs/heads/main' && needs.detect-changes.outputs.webapp == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=match,pattern=webapp-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=webapp-v(\d+\.\d+)\.\d+,group=1
            type=match,pattern=webapp-v(\d+)\.\d+\.\d+,group=1
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./webapp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true

      - name: Sign image with cosign
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
