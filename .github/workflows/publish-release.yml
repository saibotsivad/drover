name: Publish release

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'versioning'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release requirements
        run: pip install -r requirements-release.txt

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag each project whose CHANGELOG.yml changed
        run: |
          set -euo pipefail
          changed=$(git diff --name-only HEAD~1 HEAD -- '*/CHANGELOG.yml' || true)
          if [ -z "$changed" ]; then
            echo "No CHANGELOG.yml changes in this merge; nothing to tag."
            exit 0
          fi
          while IFS= read -r path; do
            project=$(dirname "$path")
            version=$(python3 -c "import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))['published'])" "$path")
            tag="${project}-v${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "Tag ${tag} already exists; skipping."
              continue
            fi
            echo "Creating tag ${tag}"
            git tag -a "$tag" -m "${project} ${version}"
            git push origin "$tag"
          done <<< "$changed"
