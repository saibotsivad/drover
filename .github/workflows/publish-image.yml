name: Publish image (reusable)

on:
  workflow_call:
    inputs:
      image_suffix:
        description: 'Suffix appended to ghcr.io/<repo> (e.g. "", "-builder", "-webapp").'
        required: true
        type: string
      context:
        description: 'Build context path (e.g. ./orchestrator).'
        required: true
        type: string
      version:
        description: 'Bare semver (e.g. 1.2.3) for release builds; empty string for SHA-only builds.'
        required: false
        type: string
        default: ""
      mark_latest:
        description: 'Tag this build as :latest. Only true on release builds.'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ inputs.image_suffix }}
          tags: |
            type=semver,pattern={{version}},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha
            type=raw,value=latest,enable=${{ inputs.mark_latest }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true

      - name: Sign image with cosign
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ github.repository }}${{ inputs.image_suffix }}@${{ steps.build.outputs.digest }}
