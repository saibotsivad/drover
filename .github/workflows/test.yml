name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r orchestrator/requirements.txt -r requirements-test.txt

      - name: Install executor
        run: pip install -e executor/

      - name: Run orchestrator tests
        timeout-minutes: 5
        run: pytest tests/ -v --asyncio-mode=auto -o asyncio_default_fixture_loop_scope=function

      - name: Run executor tests
        timeout-minutes: 5
        run: pytest executor/tests/ -v -s -p no:asyncio -p no:anyio

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./orchestrator
          push: false
          load: true
          tags: drover:test

      - name: Smoke test
        run: |
          docker run -d --name drover-smoke \
            -p 8000:8000 \
            -e DB_PATH=/tmp/db.sqlite \
            -e SOCKET_DIR=/tmp/sockets \
            drover:test

          # Wait for server to be ready (up to 10s)
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          # Verify health response
          curl -sf http://localhost:8000/health \
            | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['healthy'] is True, d"

          echo "Smoke test passed"
          docker logs drover-smoke
          docker stop drover-smoke
