name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r orchestrator/requirements.txt -r requirements-test.txt

      - name: Install executor
        run: pip install -e executor/

      - name: Run orchestrator tests
        timeout-minutes: 5
        run: pytest tests/ -v --asyncio-mode=auto -o asyncio_default_fixture_loop_scope=function

      - name: Run executor tests
        timeout-minutes: 5
        run: pytest executor/tests/ -v -s -p no:asyncio -p no:anyio

  webapp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Vendor htmx
        working-directory: webapp
        run: npm run vendor

      - name: Run webapp tests
        timeout-minutes: 5
        working-directory: webapp
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./orchestrator/Dockerfile
          push: false
          load: true
          tags: drover:test

      - name: Smoke test
        run: |
          docker run -d --name drover-smoke \
            -p 8000:8000 \
            -e DB_PATH=/tmp/db.sqlite \
            -e SOCKET_DIR=/tmp/sockets \
            drover:test

          # Wait for server to be ready (up to 10s)
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          # Verify health response
          curl -sf http://localhost:8000/health \
            | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['healthy'] is True, d"

          echo "Smoke test passed"
          docker logs drover-smoke
          docker stop drover-smoke

  docker-build-webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./webapp/Dockerfile
          push: false
          load: true
          tags: drover-webapp:test

      - name: Smoke test
        run: |
          # Mock orchestrator: returns {"healthy": true} on every GET. Lets
          # us exercise both /health (webapp-side) and /api/orchestrator/health
          # (proxied through to the mock) from the webapp container.
          cat > /tmp/mock-orchestrator.py <<'EOF'
          from http.server import HTTPServer, BaseHTTPRequestHandler
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{"healthy": true}')
              def log_message(self, *args):
                  pass
          HTTPServer(('0.0.0.0', 9000), Handler).serve_forever()
          EOF
          python3 /tmp/mock-orchestrator.py &
          MOCK_PID=$!

          docker run -d --name webapp-smoke \
            --network host \
            -e DROVER_ORCHESTRATOR_URL=http://127.0.0.1:9000 \
            drover-webapp:test

          # Wait for server to be ready (up to 10s)
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          # Verify webapp-side /health
          curl -sf http://localhost:8080/health \
            | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['healthy'] is True, d"

          # Verify proxy reaches the mock orchestrator
          curl -sf http://localhost:8080/api/orchestrator/health \
            | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['healthy'] is True, d"

          # Verify htmx is vendored into the image
          curl -sf http://localhost:8080/vendor/htmx.min.js | head -c 32 | grep -q "var htmx"

          echo "Smoke test passed"
          docker logs webapp-smoke
          docker stop webapp-smoke
          kill $MOCK_PID
