name: Publish Docker images to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "orchestrator-v*"
      - "builder-v*"
      - "webapp-v*"

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      orchestrator: ${{ steps.detect.outputs.orchestrator }}
      builder: ${{ steps.detect.outputs.builder }}
      webapp: ${{ steps.detect.outputs.webapp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect which project paths changed on main
        id: detect
        run: |
          set -euo pipefail
          orchestrator=false
          builder=false
          webapp=false
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            changed=$(git diff --name-only HEAD~1 HEAD || true)
            if echo "$changed" | grep -q "^orchestrator/"; then orchestrator=true; fi
            if echo "$changed" | grep -q "^builder/"; then builder=true; fi
            if echo "$changed" | grep -q "^webapp/"; then webapp=true; fi
          fi
          echo "orchestrator=$orchestrator" >> "$GITHUB_OUTPUT"
          echo "builder=$builder"           >> "$GITHUB_OUTPUT"
          echo "webapp=$webapp"             >> "$GITHUB_OUTPUT"

  publish-orchestrator:
    needs: detect-changes
    if: |
      startsWith(github.ref, 'refs/tags/orchestrator-v') ||
      (github.ref == 'refs/heads/main' && needs.detect-changes.outputs.orchestrator == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=match,pattern=orchestrator-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=orchestrator-v(\d+\.\d+)\.\d+,group=1
            type=match,pattern=orchestrator-v(\d+)\.\d+\.\d+,group=1
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/orchestrator-v') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./orchestrator
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true

      - name: Sign image with cosign
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.build.outputs.digest }}

      - name: Debug metadata
        run: |
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Labels:"
          echo "${{ steps.meta.outputs.labels }}"

  publish-builder:
    needs: detect-changes
    if: |
      startsWith(github.ref, 'refs/tags/builder-v') ||
      (github.ref == 'refs/heads/main' && needs.detect-changes.outputs.builder == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-builder
          tags: |
            type=match,pattern=builder-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=builder-v(\d+\.\d+)\.\d+,group=1
            type=match,pattern=builder-v(\d+)\.\d+\.\d+,group=1
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/builder-v') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./builder
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true

      - name: Sign image with cosign
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ github.repository }}-builder@${{ steps.build.outputs.digest }}

      - name: Debug metadata
        run: |
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Labels:"
          echo "${{ steps.meta.outputs.labels }}"

  publish-webapp:
    needs: detect-changes
    if: |
      startsWith(github.ref, 'refs/tags/webapp-v') ||
      (github.ref == 'refs/heads/main' && needs.detect-changes.outputs.webapp == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-webapp
          tags: |
            type=match,pattern=webapp-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=webapp-v(\d+\.\d+)\.\d+,group=1
            type=match,pattern=webapp-v(\d+)\.\d+\.\d+,group=1
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/webapp-v') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./webapp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true

      - name: Sign image with cosign
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ github.repository }}-webapp@${{ steps.build.outputs.digest }}

      - name: Debug metadata
        run: |
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Labels:"
          echo "${{ steps.meta.outputs.labels }}"
