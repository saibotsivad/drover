name: Publish SHA-tagged Docker images to GHCR

on:
  push:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      orchestrator: ${{ steps.detect.outputs.orchestrator }}
      builder:      ${{ steps.detect.outputs.builder }}
      webapp:       ${{ steps.detect.outputs.webapp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect which project paths changed on main
        id: detect
        run: |
          set -euo pipefail
          orchestrator=false
          builder=false
          webapp=false
          changed=$(git diff --name-only HEAD~1 HEAD || true)
          if echo "$changed" | grep -q "^orchestrator/"; then orchestrator=true; fi
          if echo "$changed" | grep -q "^builder/";      then builder=true;      fi
          if echo "$changed" | grep -q "^webapp/";       then webapp=true;       fi
          echo "orchestrator=$orchestrator" >> "$GITHUB_OUTPUT"
          echo "builder=$builder"           >> "$GITHUB_OUTPUT"
          echo "webapp=$webapp"             >> "$GITHUB_OUTPUT"

  publish-orchestrator:
    needs: detect-changes
    if: needs.detect-changes.outputs.orchestrator == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image_suffix: ""
      dockerfile: ./orchestrator/Dockerfile

  publish-builder:
    needs: detect-changes
    if: needs.detect-changes.outputs.builder == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image_suffix: "-builder"
      dockerfile: ./builder/Dockerfile

  publish-webapp:
    needs: detect-changes
    if: needs.detect-changes.outputs.webapp == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image_suffix: "-webapp"
      dockerfile: ./webapp/Dockerfile
